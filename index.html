<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Rotating Job Watch</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
<header>
  <div><h1>Rotating Job Watch</h1><p>Ontario technical sales monitor</p></div>
  <span id="liveBadge" class="live">LIVE</span>
</header>

<nav>
  <button class="active" data-view="new">New Jobs</button>
  <button data-view="all">All Jobs</button>
  <button data-view="companies">Companies</button>
  <button data-view="applications">Applications</button>
</nav>

<section class="summary">
  <div><b id="newCount">0</b><span>New jobs</span></div>
  <div><b id="jobCount">0</b><span>Current jobs</span></div>
  <div><b id="companyCount">0</b><span>Targets</span></div>
</section>

<div class="last-check">Last checked: <span id="lastChecked">Not yet</span></div>
<section id="content"></section>
</main>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script>
</body>
</html>
