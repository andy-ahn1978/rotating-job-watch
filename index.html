<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Career Job Watch</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header class="app-header">
    <div>
      <div class="brand-row">
        <h1>Career Job Watch</h1>
        <span id="liveBadge" class="live">...</span>
      </div>
      <p>Ontario rotating equipment & technical sales</p>
    </div>
  </header>

  <section class="status-strip" aria-label="Dashboard summary">
    <div><span>New</span><b id="newCount">0</b></div>
    <div><span>Jobs</span><b id="jobCount">0</b></div>
    <div><span>Targets</span><b id="companyCount">0</b></div>
    <div><span>Applied</span><b id="applicationCount">0</b></div>
    <div><span>Pipeline</span><b id="interviewCount">0</b></div>
  </section>

  <div class="last-check">Last checked <span id="lastChecked">Not yet</span></div>

  <nav class="primary-nav" aria-label="Main navigation">
    <button class="active" data-view="jobs"><span class="nav-icon">⌕</span><span>Jobs</span></button>
    <button data-view="companies"><span class="nav-icon">▦</span><span>Companies</span></button>
    <button data-view="applications"><span class="nav-icon">✓</span><span>Applications</span></button>
    <button data-view="more"><span class="nav-icon">•••</span><span>More</span></button>
  </nav>

  <section id="content"></section>
</main>

<script src="app.js"></script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
