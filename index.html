<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Career Job Watch</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>Career Job Watch</h1>
      <p>Ontario rotating equipment & technical sales career hub</p>
    </div>
    <span id="liveBadge" class="live">...</span>
  </header>

  <nav>
    <button class="active" data-view="new">New Jobs</button>
    <button data-view="all">All Jobs</button>
    <button data-view="companies">Companies</button>
    <button data-view="applications">Applications</button>
    <button data-view="hidden">Hidden Jobs</button>
    <button data-view="profile">My Profile</button>
  </nav>

  <section class="summary">
    <div><b id="newCount">0</b><span>New jobs</span></div>
    <div><b id="jobCount">0</b><span>Current jobs</span></div>
    <div><b id="companyCount">0</b><span>Targets</span></div>
    <div><b id="applicationCount">0</b><span>Applications</span></div>
    <div><b id="interviewCount">0</b><span>Interview pipeline</span></div>
  </section>

  <div class="last-check">Last checked: <span id="lastChecked">Not yet</span></div>
  <section id="content"></section>
</main>

<script src="app.js"></script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
