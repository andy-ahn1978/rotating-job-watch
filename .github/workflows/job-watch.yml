name: Job Watch V3

on:
  schedule:
    - cron: '15 12 * * *'
    - cron: '15 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Check official career pages
        run: python scripts/monitor.py

      - name: Send alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py

      - name: Save results
        run: |
          git config user.name "job-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json seen_jobs.json new_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update monitored jobs"
            git push
          fi
